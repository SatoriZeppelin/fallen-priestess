  <script>
    (function () {
      var GAME_BASE = 'https://satorizeppelin.github.io/fallen-priestess/';
      var GAME_INDEX = GAME_BASE + 'index.html';
      var GAME_INDEX_CDN = 'https://cdn.jsdelivr.net/gh/SatoriZeppelin/fallen-priestess@main/index.html';

      var HF_FILE = 'https://huggingface.co/think-denim-frisk/FallenPriestess/resolve/main/.gitattributes';

      var fallback = document.getElementById('fallback');
      var app = document.getElementById('app');

      function fitBootFrame() {
        var iframe = window.frameElement;
        if (!iframe || iframe.getAttribute('data-fp-pinned') === '1') return;

        iframe.style.setProperty('max-height', 'none', 'important');
        iframe.style.setProperty('overflow', 'visible', 'important');
      }

      function readGlobal(name, test) {
        var scopes = [window];
        try { if (window.parent && window.parent !== window) scopes.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window) scopes.push(window.top); } catch (e) {}
        for (var i = 0; i < scopes.length; i++) {
          try {
            var value = scopes[i][name];
            if (value && (!test || test(value))) return value;
          } catch (e) {}
        }
        return null;
      }

      function setCheck(id, ok, state, detail) {
        var el = document.getElementById(id);
        el.classList.toggle('is-ok', !!ok);
        el.classList.toggle('is-bad', !ok);
        el.querySelector('.check-state').textContent = state;
        var detailEl = el.querySelector('.check-detail');
        detailEl.innerHTML = detail || '';
        detailEl.hidden = !detail;
      }

      function formatVersion(v) {
        if (!v) return '';
        var s = String(v).trim();
        if (!s) return '';
        return /^v/i.test(s) ? s : 'v' + s;
      }

      function getScopes() {
        var scopes = [window];
        try { if (window.parent && window.parent !== window) scopes.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window && scopes.indexOf(window.top) === -1) scopes.push(window.top); } catch (e) {}
        return scopes;
      }

      function readExtVersionFromDom(keywords) {
        var scopes = getScopes();
        for (var i = 0; i < scopes.length; i++) {
          try {
            var doc = scopes[i].document;
            if (!doc) continue;
            var els = doc.querySelectorAll('#extensions_settings [id], #extensions_settings2 [id], .extension_block, [data-extension-name]');
            for (var j = 0; j < els.length; j++) {
              var text = (els[j].textContent || '') + ' ' + (els[j].id || '');
              var hit = false;
              for (var m = 0; m < keywords.length; m++) {
                if (text.toLowerCase().indexOf(keywords[m].toLowerCase()) !== -1) { hit = true; break; }
              }
              if (hit) {
                var match = text.match(/\bv?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\b/);
                if (match) return formatVersion(match[0]);
              }
            }
          } catch (e) {}
        }
        return '';
      }

      function fetchExtManifestVersion(folderNames, onVersion) {
        var prefixes = [
          '/scripts/extensions/third-party/',
          '/scripts/extensions/'
        ];
        var urls = [];
        for (var i = 0; i < folderNames.length; i++) {
          for (var j = 0; j < prefixes.length; j++) {
            urls.push(prefixes[j] + folderNames[i] + '/manifest.json');
          }
        }
        var idx = 0;
        function tryNext() {
          if (idx >= urls.length) return;
          var url = urls[idx++];
          fetch(url, { method: 'GET', cache: 'no-store' })
            .then(function (r) { return r && r.ok ? r.json() : null; })
            .then(function (data) {
              if (data && data.version) {
                onVersion(formatVersion(data.version));
              } else {
                tryNext();
              }
            })
            .catch(function () { tryNext(); });
        }
        tryNext();
      }

      function readExtManifestVersion(keywords) {
        var scopes = getScopes();
        for (var i = 0; i < scopes.length; i++) {
          try {
            var st = scopes[i].SillyTavern;
            var ctx = st && typeof st.getContext === 'function' ? st.getContext() : null;
            var manifests = (ctx && (ctx.extensionManifests || (ctx.extensionSettings && ctx.extensionSettings.manifests))) || scopes[i].extension_manifests || scopes[i].manifests || null;
            if (manifests && typeof manifests === 'object') {
              var keys = Object.keys(manifests);
              for (var j = 0; j < keys.length; j++) {
                var k = keys[j];
                for (var m = 0; m < keywords.length; m++) {
                  if (k.toLowerCase().indexOf(keywords[m].toLowerCase()) !== -1) {
                    var ver = manifests[k] && manifests[k].version;
                    if (ver) return formatVersion(ver);
                  }
                }
              }
            }
          } catch (e) {}
        }
        return readExtVersionFromDom(keywords);
      }

      function resolveTavernHelperVersion(th) {
        try {
          if (typeof th.getTavernHelperVersion === 'function') {
            var v0 = th.getTavernHelperVersion();
            if (v0 && typeof v0 === 'string') return formatVersion(v0);
          }
          if (typeof th.getVersion === 'function') {
            var v = th.getVersion();
            if (v && typeof v === 'string') return formatVersion(v);
          }
          if (typeof th.version === 'string' && th.version) return formatVersion(th.version);
          if (typeof th.VERSION === 'string' && th.VERSION) return formatVersion(th.VERSION);
        } catch (e) {}
        var scopes = getScopes();
        for (var i = 0; i < scopes.length; i++) {
          try {
            if (typeof scopes[i].getTavernHelperVersion === 'function') {
              var sv = scopes[i].getTavernHelperVersion();
              if (sv && typeof sv === 'string') return formatVersion(sv);
            }
          } catch (e) {}
        }
        return readExtManifestVersion(['JS-Slash-Runner', 'TavernHelper', '酒馆助手', 'slash-runner']);
      }

      function resolvePromptHelperVersion(ejs) {
        try {
          if (typeof ejs.getVersion === 'function') {
            var v = ejs.getVersion();
            if (v && typeof v === 'string') return formatVersion(v);
          }
          if (typeof ejs.version === 'string' && ejs.version) return formatVersion(ejs.version);
          if (typeof ejs.VERSION === 'string' && ejs.VERSION) return formatVersion(ejs.VERSION);
        } catch (e) {}
        return readExtManifestVersion(['ST-Prompt-Template', 'Prompt-Template', '提示词模板', 'EjsTemplate']);
      }

      function checkTavernHelper() {
        var th = readGlobal('TavernHelper', function (api) {
          return typeof api.generate === 'function';
        });
        if (th) {
          var ver = resolveTavernHelperVersion(th);
          setCheck('chk-th', true, ver || '已安装', '');
          var asyncFn = (typeof th.getTavernHelperVersion === 'function' && th.getTavernHelperVersion) ||
                        (typeof th.getVersion === 'function' && th.getVersion);
          if (asyncFn) {
            try {
              Promise.resolve(asyncFn.call(th)).then(function (v) {
                var fv = formatVersion(v);
                if (fv) setCheck('chk-th', true, fv, '');
              }).catch(function () {});
            } catch (e) {}
          }
          if (!ver) {
            fetchExtManifestVersion(['JS-Slash-Runner', 'TavernHelper'], function (fv) {
              if (fv) setCheck('chk-th', true, fv, '');
            });
          }
          return true;
        }
        setCheck(
          'chk-th',
          false,
          '未安装',
          '未找到酒馆助手。请安装 <a href="https://github.com/N0VI028/JS-Slash-Runner" target="_blank" rel="noopener">JS-Slash-Runner</a> 并勾选启用。'
        );
        return false;
      }

      function checkPromptHelper() {
        var ejs = readGlobal('EjsTemplate', function (api) {
          return typeof api.evalTemplate === 'function' || typeof api.prepareContext === 'function';
        });
        if (ejs) {
          var ver = resolvePromptHelperVersion(ejs);
          setCheck('chk-prompt', true, ver || '已安装', '');
          if (ejs && typeof ejs.getVersion === 'function') {
            try {
              Promise.resolve(ejs.getVersion()).then(function (v) {
                var fv = formatVersion(v);
                if (fv) setCheck('chk-prompt', true, fv, '');
              }).catch(function () {});
            } catch (e) {}
          }
          if (!ver) {
            fetchExtManifestVersion(['ST-Prompt-Template', 'Prompt-Template'], function (fv) {
              if (fv) setCheck('chk-prompt', true, fv, '');
            });
          }
          return true;
        }
        setCheck(
          'chk-prompt',
          false,
          '未安装',
          '未找到提示词助手。请安装 <a href="https://github.com/zonde306/ST-Prompt-Template" target="_blank" rel="noopener">ST-Prompt-Template</a> 并启用 Prompt Template。'
        );
        return false;
      }

      function fetchWithTimeout(url, ms) {
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, ms);
        return fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: ctrl.signal })
          .finally(function () { clearTimeout(timer); });
      }

      function checkHuggingFace() {
        var started = Date.now();
        return fetchWithTimeout(HF_API, 8000)
          .catch(function () { return fetchWithTimeout(HF_FILE, 8000); })
          .then(function (res) {
            var ms = Date.now() - started;
            if (!res || !res.ok) throw new Error(res ? String(res.status) : '网络失败');
            setCheck('chk-hf', true, ms + ' ms', '');
            return true;
          })
          .catch(function () {
            setCheck(
              'chk-hf',
              false,
              '不合格',
              '与Hugging Face的连接已断开，请检查网络设置。'
            );
            return false;
          });
      }

      function injectBase(html, baseHref) {
        var b = baseHref || GAME_BASE;
        var closeScr = '</scr' + 'ipt>';
        var tag = '<base href="' + b + '">\n  <script>window.__FP_TAVERN_BOOT__ = true;' + closeScr;
        var out = html;
        if (/<base\s/i.test(out)) {
          out = out.replace(/<base\b[^>]*>/i, tag);
        } else {
          out = out.replace(/<head[^>]*>/i, function (open) {
            return open + '\n  ' + tag;
          });
        }
        var bust = 'v=' + Date.now();
        out = out.replace(/(<(?:script|link)\b[^>]+(?:src|href)=")(?:interface|resource)\/[^"?]+(\?[^"]*)?(")/gi, function (_m, p1, _q, p3) {
          var clean = _m.slice(p1.length, _m.length - p3.length).split('?')[0];
          return p1 + clean + '?' + bust + p3;
        });
        return out;
      }

      function cleanDuplicateTavernFrames() {
        var iframe = window.frameElement;
        if (!iframe) return;
        try {
          var doc = window.parent && window.parent.document;
          if (!doc) return;
          var frames = doc.querySelectorAll('iframe');
          for (var i = 0; i < frames.length; i++) {
            var f = frames[i];
            if (f === iframe) continue;
            var isFp = f.getAttribute('data-fp-frame') === '1';
            if (!isFp) {
              try {
                var cw = f.contentWindow;
                var cd = f.contentDocument || (cw && cw.document);
                if (cw && cw.__FP_TAVERN_BOOT__) isFp = true;
                else if (cd && cd.title && cd.title.indexOf('妹神官') !== -1) isFp = true;
              } catch (e) {}
            }
            if (isFp) {
              var msgBlock = f.closest && f.closest('.mes');
              var myBlock = iframe.closest && iframe.closest('.mes');
              if (msgBlock && myBlock && msgBlock === myBlock) {
                if (f.parentNode) f.parentNode.removeChild(f);
              } else {
                f.style.setProperty('display', 'none', 'important');
              }
            }
          }
        } catch (e) {}
      }

      function setEmbedTavernFrame() {
        var iframe = window.frameElement;
        if (!iframe) return;
        iframe.setAttribute('data-fp-frame', '1');
        cleanDuplicateTavernFrames();
        document.documentElement.classList.add('is-filled');
        iframe.removeAttribute('data-fp-pinned');
        iframe.style.setProperty('position', 'relative', 'important');
        iframe.style.setProperty('top', 'auto', 'important');
        iframe.style.setProperty('left', 'auto', 'important');
        iframe.style.setProperty('right', 'auto', 'important');
        iframe.style.setProperty('bottom', 'auto', 'important');
        iframe.style.setProperty('width', '100%', 'important');
        iframe.style.setProperty('max-width', '100%', 'important');
        iframe.style.setProperty('aspect-ratio', '16 / 9', 'important');
        iframe.style.setProperty('height', 'auto', 'important');
        iframe.style.setProperty('min-height', '480px', 'important');
        iframe.style.setProperty('max-height', '85vh', 'important');
        iframe.style.setProperty('border', '0', 'important');
        iframe.style.setProperty('border-radius', '8px', 'important');
        iframe.style.setProperty('overflow', 'hidden', 'important');
        iframe.style.setProperty('background', '#000', 'important');
        iframe.style.setProperty('display', 'block', 'important');
      }

      var starting = false;
      function startGame() {
        if (starting) return;
        starting = true;
        var btn = document.getElementById('btn-start');
        var msg = document.getElementById('start-msg');
        btn.disabled = true;
        msg.classList.remove('is-bad');
        msg.textContent = '正在载入游戏…';

        var nowBust = 't=' + Date.now();
        function withBust(u) {
          return u + (u.indexOf('?') === -1 ? '?' : '&') + nowBust;
        }
        var sources = [];
        try {
          if (/^https?:/i.test(location.protocol) && !window.frameElement) {
            sources.push({ url: withBust(new URL('index.html', location.href).href), base: new URL('./', location.href).href });
          }
        } catch (e) {}
        sources.push(
          { url: withBust(GAME_INDEX), base: GAME_BASE },
          { url: withBust(GAME_INDEX_CDN), base: 'https://cdn.jsdelivr.net/gh/SatoriZeppelin/fallen-priestess@main/' }
        );

        var next = Promise.reject();
        sources.forEach(function (src) {
          next = next.catch(function () {
            return fetchWithTimeout(src.url, 12000).then(function (res) {
              if (!res.ok) throw new Error(String(res.status));
              return res.text().then(function (text) {
                return { html: text, base: src.base };
              });
            });
          });
        });

        return next.then(function (payload) {
          var html = payload && payload.html;
          if (!html || html.indexOf('妹神官') === -1) throw new Error('页面内容异常');
          setEmbedTavernFrame();
          window.__FP_TAVERN_BOOT__ = true;
          document.open();
          document.write(injectBase(html, payload.base));
          document.close();
        }).catch(function (err) {
          starting = false;
          btn.disabled = false;
          msg.classList.add('is-bad');
          msg.textContent = '载入失败：' + (err && err.message ? err.message : err) + '。可直接打开 ' + GAME_BASE;
        });
      }

      Promise.resolve()
        .then(function () {
          var th = checkTavernHelper();
          var prompt = checkPromptHelper();
          return checkHuggingFace().then(function (hf) {
            return th && prompt && hf;
          });
        })
        .then(function (ready) {
          var actions = document.getElementById('actions');
          if (ready) {
            actions.classList.add('is-ready');
            document.getElementById('btn-start').addEventListener('click', startGame);
          }
          fitBootFrame();
          requestAnimationFrame(fitBootFrame);
        });
      fitBootFrame();
    })();
  </script>
